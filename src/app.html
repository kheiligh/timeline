<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link id="favicon" rel="icon" type="image/png" href="%sveltekit.assets%/favicons/01.png" />
		<script>
			// Random favicon on every visit/refresh. Icons are static/favicons/01.png … NN.png;
			// update FAVICON_COUNT when adding or removing files.
			(function () {
				var FAVICON_COUNT = 35;
				var n = Math.floor(Math.random() * FAVICON_COUNT) + 1;
				document.getElementById('favicon').href =
					'%sveltekit.assets%/favicons/' + (n < 10 ? '0' : '') + n + '.png';
			})();
		</script>
		<style>
			/* Self-hosted from static/fonts (SIL Open Font License, see OFL-*.txt there). */
			@font-face { font-family: 'Castoro Titling'; src: url('%sveltekit.assets%/fonts/CastoroTitling-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
			@font-face { font-family: 'Cousine'; src: url('%sveltekit.assets%/fonts/Cousine-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
			@font-face { font-family: 'Cousine'; src: url('%sveltekit.assets%/fonts/Cousine-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
			@font-face { font-family: 'Cousine'; src: url('%sveltekit.assets%/fonts/Cousine-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
			@font-face { font-family: 'Cousine'; src: url('%sveltekit.assets%/fonts/Cousine-BoldItalic.woff2') format('woff2'); font-weight: 700; font-style: italic; font-display: swap; }
			:root { --font-display: 'Castoro Titling', Georgia, 'Times New Roman', serif; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
